<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 PLAN</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    .nav {
      display: flex;
      background: #4f46e5;
      padding: 0;
      height: 40px;
    }
    .nav-btn {
      flex: 1;
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 0 8px;
      transition: all 0.15s;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .nav-btn:hover { color: white; background: rgba(255,255,255,0.1); }
    .nav-btn.active {
      color: white;
      background: rgba(255,255,255,0.15);
      border-bottom: 2px solid white;
    }
    .nav-btn-external {
      flex: 0 0 40px;
      background: none;
      border: none;
      border-left: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.7);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn-external:hover { color: white; background: rgba(255,255,255,0.1); }
    iframe {
      width: 100%;
      height: calc(100% - 40px);
      border: none;
    }
  </style>
</head>
<body>
  <div class="nav">
    <button class="nav-btn active" id="nav-dashboard">대시보드</button>
    <button class="nav-btn" id="nav-converter">변환기</button>
    <button class="nav-btn-external" id="nav-external" title="새 탭에서 열기">↗</button>
  </div>
  <iframe id="app-frame" src="https://2026-plan-8zwh.vercel.app/dashboard"></iframe>
  <script src="sidepanel.js"></script>
</body>
</html>
